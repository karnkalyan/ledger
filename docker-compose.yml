services:
  leader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leader_app
    restart: unless-stopped
    ports:
      - "${PORT:-3080}:${PORT:-3080}"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-mysql://root:quantumSql%40123@host.docker.internal:3306/ledger}
      AUTH_SECRET: ${AUTH_SECRET:-eFRIxdl2TCtTV0MJKnbaakG6Hhnav9tWadtiefwooXWqfwFVVHzuiRZggP4ZY7O4}
      CRON_SECRET: ${CRON_SECRET:-63EWQf3Ttdf-UW9OoID6fGHC2J4JZ32-lSkHqY-sA0QZvFtw_dYsJHybCgDMC2DL}
      SEED_ON_STARTUP: "false"
      PORT: ${PORT:-3080}
      APP_URL: ${APP_URL:-https://ledger.simulcast.com.np}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://ledger.simulcast.com.np}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-QVEuQWI4Uk42TDRLWGpLb1UxemF6Qkl6eUY2c3NYTEp2U2pYMXdfVTF1WGktYVBCY0tmcWc=}
      MCP_API_KEY: ${MCP_API_KEY:-2b533bcb16c0ea4d2439039ed9d81a3e33ac0964207b34fb2bea14a8f096561f}
      MCP_JWT_SECRET: ${MCP_JWT_SECRET:-xC19T5q1-MrjBY4VmMNkYtwLfsKK7n4MZbO3B3oShy14Nt2iXzTwaQos2wVj-r6N}
      ADMIN_KEY: ${ADMIN_KEY:-simulcast-admin}
    extra_hosts:
      # Allows the container to resolve host.docker.internal to the VPS host where MySQL is running
      - "host.docker.internal:host-gateway"
