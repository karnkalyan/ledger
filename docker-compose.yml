services:
  leader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leader_app
    restart: unless-stopped
    ports:
      - "${PORT:-3080}:${PORT:-3080}"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-mysql://root:quantumSql%40123@host.docker.internal:3306/ledger}
      AUTH_SECRET: ${AUTH_SECRET:-eFRIxdl2TCtTV0MJKnbaakG6Hhnav9tWadtiefwooXWqfwFVVHzuiRZggP4ZY7O4}
      CRON_SECRET: ${CRON_SECRET:-63EWQf3Ttdf-UW9OoID6fGHC2J4JZ32-lSkHqY-sA0QZvFtw_dYsJHybCgDMC2DL}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-false}
      PORT: ${PORT:-3080}
      APP_URL: ${APP_URL:-https://leader.simulcast.com.np}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://leader.simulcast.com.np}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MCP_API_KEY: ${MCP_API_KEY:-leader_master_mcp_api_key_2026_sec}
      MCP_JWT_SECRET: ${MCP_JWT_SECRET:-leader_mcp_jwt_secret_secure_key_2026_x92817491823}
    extra_hosts:
      # Allows the container to resolve host.docker.internal to the VPS host where MySQL is running
      - "host.docker.internal:host-gateway"
